}
function closeMenus() { clearTimeout(closeTimer); openMenu(null); }
function scheduleClose() { clearTimeout(closeTimer); closeTimer = setTimeout(closeMenus, 160); }
function bindChrome() {
  const fine = window.matchMedia('(hover:hover) and (pointer:fine)');
  const wrapCaps = $('[data-wrap="caps"]'), wrapSols = $('[data-wrap="sols"]'), wrapComp = $('[data-wrap="comp"]'), wrapPart = $('[data-wrap="part"]'), mega = $('#megaCaps');
  [[wrapCaps, 'caps'], [mega, 'caps'], [wrapSols, 'sols'], [wrapComp, 'comp'], [wrapPart, 'part']].forEach(([el, name]) => {
    el.addEventListener('mouseenter', () => { if (fine.matches) { if ($('[data-menu="' + name + '"]').getAttribute('aria-expanded') !== 'true') hoverOpenedAt = Date.now(); openMenu(name); } });
    el.addEventListener('mouseleave', () => { if (fine.matches) scheduleClose(); });
  });
  $$('[data-menu]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = b.getAttribute('aria-expanded') === 'true';
    if (isOpen && fine.matches && Date.now() - hoverOpenedAt < 700) return; // opened by hover a moment ago: keep it open
    isOpen ? closeMenus() : openMenu(b.dataset.menu);
  }));
  document.addEventListener('click', e => { if (!e.target.closest('.navitem') && !e.target.closest('#megaCaps')) closeMenus(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const open = $('[data-menu][aria-expanded="true"]');
    if (open) { closeMenus(); open.focus(); }
    if ($('#mnav').classList.contains('open')) closeMnav();
  });
  // Theme
  const sel = $('#themeSelect');
  sel.value = store.get('cg-theme') || 'system';
  sel.addEventListener('change', () => { store.set('cg-theme', sel.value); applyTheme(sel.value); });
}
function applyTheme(v) { if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); }
function openMnav() {
  const m = $('#mnav'); m.classList.add('open'); document.body.style.overflow = 'hidden';
  $('.menu-btn[data-action="open-mnav"]').setAttribute('aria-expanded', 'true');
  $('[data-action="close-mnav"]').focus();
}
function closeMnav() {
  const m = $('#mnav'); if (!m.classList.contains('open')) return;
  m.classList.remove('open'); document.body.style.overflow = '';
  const b = $('.menu-btn[data-action="open-mnav"]'); b.setAttribute('aria-expanded', 'false');
}

/* ---------- Cookie banner ---------- */
function cookieInit() {
  if (!store.get('cg-consent')) $('#cookie').hidden = false;
}
function cookieSave(analytics) {
  store.set('cg-consent', JSON.stringify({ analytics: !!analytics, at: new Date().toISOString() }));
  $('#cookie').hidden = true; $('#cookieManage').hidden = true; $('#cookieManageBtn').textContent = 'Manage choices';
}

/* ---------- Global actions ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  if (act === 'prefill' || act === 'prefill-link') {
    e.preventDefault();
    const ids = (a.dataset.caps || '').split(',').filter(Boolean);
    state.prefill = { needs: ids.map(id => CAP[id] ? CAP[id].name : id), programme: a.dataset.programme || '', note: a.dataset.note || '' };
    go('#/start-a-project');
  } else if (act === 'clear-prefill') { state.prefill = null; render(); }
  else if (act === 'cmp-clear') { state.composer.clear(); updateComposer(); const first = $('.node'); if (first) first.focus(); }
  else if (act === 'focus-field') {
    const id = a.dataset.field; const el = $('#' + id) && $('#' + id).tagName === 'FIELDSET' ? $('#' + id + '-first') : $('#' + id);
    if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
  }
  else if (act === 'scroll') {
    e.preventDefault(); const t = document.getElementById(a.dataset.target);
    if (t) {
      t.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      const fi = a.dataset.focus ? $('input,select,textarea', t) : $('h2', t);
      if (fi) { if (!a.dataset.focus) fi.setAttribute('tabindex', '-1'); fi.focus({ preventScroll: true }); }
    }
  }
  else if (act === 'shortlist') slToggle(a.dataset.svc);
  else if (act === 'stage-save') {
    const id = a.dataset.id; a.disabled = true;
    state.db.doc('enquiries/' + id).update({ stage: document.getElementById('st-' + id).value, value: digitsOnly(document.getElementById('dv-' + id).value) })
      .then(() => { a.textContent = 'Saved'; setTimeout(() => { a.textContent = 'Save'; a.disabled = false; }, 1500); }).catch(() => { a.disabled = false; });
  }
  else if (act === 'ov-refresh') renderOverview();
  else if (act === 'copy') {
    const src = a.dataset.copyFrom ? document.getElementById(a.dataset.copyFrom) : null;
    const text = a.dataset.copy || (src ? (src.value !== undefined ? src.value : src.textContent) : '');
    copyText(text).then(ok => {
      const old = a.textContent; a.textContent = ok ? 'Copied' : 'Select and copy';
      if (!ok && src && src.select) { src.focus(); src.select(); }
      setTimeout(() => { a.textContent = old; }, 1800);
    });
  }
  else if (act === 'aff-approve') {
    const id = a.dataset.id; a.disabled = true;
    (async () => {
      try {
        const app = (await state.db.doc('affiliates/' + id).get()).data() || {}, code = await uniqueAffCode(app.name), now = new Date().toISOString();
        await state.db.doc('affcodes/' + id).set({ code: code, name: app.name || '', status: 'active', createdAt: now, leads: [] });
        await state.db.doc('affiliates/' + id).update({ status: 'approved', code: code });
      } catch (e) { a.disabled = false; window.alert('That didn’t save. Try again.'); }
    })();
  }
  else if (act === 'aff-decline') { a.disabled = true; state.db.doc('affiliates/' + a.dataset.id).update({ status: 'declined' }).catch(() => { a.disabled = false; }); }
  else if (act === 'wl-approve') {
    const id = a.dataset.id; a.disabled = true;
    (async () => {
      try {
        const app = (await state.db.doc('wlapps/' + id).get()).data() || {};
        await state.db.doc('wlpartners/' + id).set({ company: app.company || '', name: app.name || '', status: 'active', createdAt: new Date().toISOString() });
        await state.db.doc('wlapps/' + id).update({ status: 'approved' });
      } catch (e) { a.disabled = false; window.alert('That didn’t save. Try again.'); }
    })();
  }
  else if (act === 'wl-decline') { a.disabled = true; state.db.doc('wlapps/' + a.dataset.id).update({ status: 'declined' }).catch(() => { a.disabled = false; }); }
  else if (act === 'wl-briefs') loadWlBriefs(a.dataset.id);
  else if (act === 'wl-brief-save') {
    const sel = document.getElementById('wls-' + a.dataset.bid); a.disabled = true;
    state.db.doc('wlbriefs/' + a.dataset.pid + '/items/' + a.dataset.bid).update({ status: sel.value })
      .then(() => { a.textContent = 'Updated'; setTimeout(() => { a.textContent = 'Update status'; a.disabled = false; }, 1500); })
      .catch(() => { a.disabled = false; });
  }
  else if (act === 'ref-save') {
    const id = a.dataset.id, st = document.getElementById('rs-' + id).value, cm = digitsOnly(document.getElementById('rc-' + id).value), m = document.getElementById('rm-' + id);
    a.disabled = true;
    (async () => {
      try {
        const r = (await state.db.doc('enquiries/' + id).get()).data() || {};
        const ok = await syncReferral(id, r, st, cm);
        if (m) m.textContent = ok ? 'Saved. The partner sees this in their dashboard.' : 'Saved on the enquiry, but no active partner uses code ' + r.partnerRef + '.';
      } catch (e) { if (m) m.textContent = 'That didn’t save. Try again.'; }
      a.disabled = false;
    })();
  }
  else if (act === 'plan') { state.joinPlan = a.dataset.plan; go('#/community/join'); }
  else if (act === 'msg-del') {
    if (window.confirm('Delete this message?')) state.db.collection('channels/' + state.chatChannel + '/messages').doc(a.dataset.id).delete().catch(() => {});
  }
  else if (act === 'app-approve') {
    const id = a.dataset.id; a.disabled = true;
    (async () => {
      try {
        const snap = await state.db.doc('applications/' + id).get(); const d = snap.data() || {}; const now = new Date().toISOString();
        await state.db.doc('members/' + id).set({ name: d.name || '', role: d.role || '', company: d.company || '', city: d.city || '', linkedin: d.linkedin || '', interests: d.interests || [], working: d.working || '', plan: d.plan || '', status: 'active', createdAt: now, joinedAt: now, ref: d.ref || '' });
        await state.db.doc('applications/' + id).update({ status: 'approved' });
      } catch (e) { a.disabled = false; window.alert('That didn’t save. Try again.'); }
    })();
  }
  else if (act === 'app-decline') { a.disabled = true; state.db.doc('applications/' + a.dataset.id).update({ status: 'declined' }).catch(() => { a.disabled = false; }); }
  else if (act === 'member-remove') {
    if (!window.confirm('Remove this member’s access?')) return;
    const id = a.dataset.id; a.disabled = true;
    Promise.all([state.db.doc('members/' + id).delete(), state.db.doc('applications/' + id).update({ status: 'removed' }).catch(() => {})]).catch(() => { a.disabled = false; });
  }
  else if (act === 'sl-remove') { slToggle(a.dataset.svc); const l = $('#slBox a'); if (l) l.focus(); }
  else if (act === 'search') { e.preventDefault(); state.focusSearch = true; go('#/services'); }
  else if (act === 'svc-reset') { state.svcQuery = ''; state.svcCap = 'all'; render(); }
  else if (act === 'totop') {
    window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const h = $('h1', main); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  else if (act === 'open-mnav') openMnav();
  else if (act === 'close-mnav') { closeMnav(); $('.menu-btn[data-action="open-mnav"]').focus(); }
  else if (act === 'skip') { const h = $('h1', main); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } else main.focus(); }
  else if (act === 'cookie-accept') cookieSave(true);
  else if (act === 'cookie-reject') cookieSave(false);
  else if (act === 'cookie-manage') {
    const m = $('#cookieManage');
    if (m.hidden) { m.hidden = false; a.textContent = 'Save choices'; const c = store.get('cg-consent'); try { $('#ckAnalytics').checked = c ? !!JSON.parse(c).analytics : false; } catch (x) {} }
    else cookieSave($('#ckAnalytics').checked);
  }
  else if (act === 'cookie-open') {
    $('#cookie').hidden = false; $('#cookieManage').hidden = false; $('#cookieManageBtn').textContent = 'Save choices';
    const c = store.get('cg-consent'); try { $('#ckAnalytics').checked = c ? !!JSON.parse(c).analytics : false; } catch (x) {}
    $('#ckAnalytics').focus();
  }
  else if (act === 'inbox-status') {
    a.disabled = true;
    state.db.collection(state.inboxTab).doc(a.dataset.id).update({ status: a.dataset.status }).catch(() => { a.disabled = false; });
  }
  else if (act === 'inbox-delete') {
    if (window.confirm('Delete this submission permanently?')) state.db.collection(state.inboxTab).doc(a.dataset.id).delete().catch(() => {});
  }
});
document.addEventListener('click', e => {
  const bc = e.target.closest('[data-blogcat]');
  if (bc) { state.blogCat = bc.dataset.blogcat; renderBlogList(state.posts); return; }
  const sf = e.target.closest('[data-svccap]');
  if (sf) { state.svcCap = sf.dataset.svccap; $$('[data-svccap]').forEach(b => b.setAttribute('aria-pressed', b === sf ? 'true' : 'false')); renderServices(); return; }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[role="tab"][data-tab]'); if (!t) return;
  state.inboxTab = t.dataset.tab;
  $$('[role="tab"]').forEach(b => b.setAttribute('aria-selected', b === t ? 'true' : 'false'));
  $('#inboxList').innerHTML = '<p class="muted">Loading…</p>';
  subscribeInbox();
});

/* ---------- Router ---------- */
function currentPath() { const h = location.hash.replace(/^#/, ''); return (h || '/').split('?')[0].replace(/\/+$/, '') || '/'; }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function resolve(path) {
  const seg = path.split('/').filter(Boolean);
  if (!seg.length) return PAGES.home();
  if (seg[0] === 'capabilities') {
    if (seg.length === 1) return PAGES.capabilities();
    const c = CAPS.find(x => x.slug === seg[1]); return c && seg.length === 2 ? capPage(c) : PAGES.notFound();
  }
  if (seg[0] === 'solutions') return seg.length <= 2 ? PAGES.solutions(seg[1]) : PAGES.notFound();
  if (seg[0] === 'services' && seg.length === 1) return PAGES.services();
  if (seg[0] === 'creators' && seg.length === 1) return PAGES.creators();
  if (seg[0] === 'tools') { if (seg.length === 1) return PAGES.tools(); if (seg.length === 2 && seg[1] === 'invite') return PAGES.invite(); if (seg.length === 2 && seg[1] === 'whatsapp') return PAGES.waTool(); if (seg.length === 2 && seg[1] === 'media-kit') return PAGES.creators(); return PAGES.notFound(); }
  if (seg[0] === 'i' && seg.length === 2) return PAGES.invitePage(seg[1]);
  if (seg[0] === 'affiliates' && seg.length === 1) return PAGES.affiliates();
  if (seg[0] === 'health-check' && seg.length === 1) return PAGES.health();
  if (seg[0] === 'white-label' && seg.length === 1) return PAGES.whitelabel();
  if (seg[0] === 'c' && seg.length === 2) return PAGES.card(seg[1]);
  if (seg[0] === 'community') {
    if (seg.length === 1) return PAGES.community();
    if (seg.length === 2 && seg[1] === 'join') return PAGES.join();
    if (seg.length === 2 && seg[1] === 'chat') return PAGES.chat();
    return PAGES.notFound();
  }
  if (seg[0] === 'blog') {
    if (seg.length === 1) return PAGES.blog();
    if (seg[1] === 'write') return seg.length <= 3 ? PAGES.write(seg[2] || null) : PAGES.notFound();
    return seg.length === 2 ? PAGES.post(decodeURIComponent(seg[1])) : PAGES.notFound();
  }
  if (seg[0] === 'services' && seg[1] === 'business-website-development' && seg.length === 2) return PAGES.service();
  const map = { 'who-we-serve': 'who', 'how-we-work': 'how', 'about': 'about', 'partners': 'partners', 'start-a-project': 'start', 'thank-you': 'thanks', 'privacy': 'privacy', 'terms': 'terms', 'cookies': 'cookies', 'inbox': 'inbox' };
  return seg.length === 1 && map[seg[0]] ? PAGES[map[seg[0]]]() : PAGES.notFound();
}
function render() {
  state.routeId++;
  if (state.inboxUnsub) { state.inboxUnsub(); state.inboxUnsub = null; }
  state.subs.forEach(u => { try { u(); } catch (e) {} }); state.subs = [];
  if (state.msgUnsub) { try { state.msgUnsub(); } catch (e) {} state.msgUnsub = null; }
  setLD(null);
  closeMenus(); closeMnav();
  let path = currentPath();
  if (/^\/r\/[^/]+/.test(path)) {
    const parts = path.split('/').filter(Boolean); setRef(parts[1]);
    path = '/' + parts.slice(2).join('/');
    try { history.replaceState(null, '', '#' + (path === '/' ? '/' : path)); } catch (e) {}
  }
  const page = resolve(path);
  main.innerHTML = page.html;
  document.title = page.title;
  const md = $('meta[name="description"]'); if (md && page.desc) md.setAttribute('content', page.desc);
  // Current-page markers
  $$('[data-nav]').forEach(a => { if (a.dataset.nav === path || path.indexOf(a.dataset.nav + '/') === 0) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const compBtn = $('[data-menu="comp"]');
  if (compBtn) compBtn.classList.toggle('is-current', ['/about', '/how-we-work', '/who-we-serve'].indexOf(path) >= 0);
  const partBtn = $('[data-menu="part"]');
  if (partBtn) partBtn.classList.toggle('is-current', ['/affiliates', '/white-label', '/partners'].indexOf(path) >= 0);
  const capsBtn = $('[data-menu="caps"]'), solsBtn = $('[data-menu="sols"]');
  if (capsBtn) capsBtn.classList.toggle('is-current', path.indexOf('/capabilities') === 0 || path.indexOf('/services/') === 0);
  if (solsBtn) solsBtn.classList.toggle('is-current', path.indexOf('/solutions') === 0);
  window.scrollTo(0, 0);
  if (page.after) page.after();
  if (!state.firstRender && !main.contains(document.activeElement)) {
    const h = $('h1', main);
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  state.firstRender = false;
  updateShortlistUI();
}

/* ---------- Boot ---------- */
applyTheme(store.get('cg-theme') || 'system');
buildChrome();
const LOGO_SVG = '<svg viewBox="0 0 ' + LOGO.vw + ' ' + LOGO.vh + '" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="' + LOGO.path + '"/><image href="' + LOGO.mark + '" x="' + LOGO.mx + '" y="' + LOGO.my + '" width="' + LOGO.mw + '" height="' + LOGO.mh + '"/></svg>';
$$('.logo-art').forEach(el => { el.innerHTML = LOGO_SVG; });
bindChrome();
bindAsk();
cookieInit();
window.addEventListener('hashchange', render);
const hdr = $('#siteHeader'), toTop = $('#toTop');
const onScroll = () => { const y = window.scrollY; hdr.classList.toggle('scrolled', y > 8); toTop.classList.toggle('show', y > 1200); };
window.addEventListener('scroll', onScroll, { passive: true });
render();
onScroll();
})();
</script>
